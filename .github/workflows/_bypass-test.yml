name: Bypass test (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "skate-board-bot"
          git config user.email "actions@github.com"
          git checkout -b bypass-test-branch
          echo "bypass test $(date -u)" >> .github/BYPASS_TEST.txt
          git add .github/BYPASS_TEST.txt
          git commit -m "Bypass test push via PR"
          git push origin bypass-test-branch
          gh pr create --base main --head bypass-test-branch --title "Bypass test PR" --body "Testing PR-based merge on protected main"
          gh pr merge bypass-test-branch --squash --delete-branch
